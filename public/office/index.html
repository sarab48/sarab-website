<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>سراب · مكتب الحجوزات</title>
<style>
  :root{
    --bg:#14100B; --panel:#1E170F; --panel-2:#241B11; --line:rgba(201,162,78,.16);
    --text:#F3E9D8; --muted:#C2A179; --gold:#C9A24E; --bronze:#A57743; --ivory:#FBF6EC;
    --ok:#86B98A; --info:#7FB3C9; --warn:#C97B6A;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font:15px/1.55 "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Kufi Arabic", system-ui, sans-serif;
  }
  a{color:var(--gold)}
  button{font:inherit; cursor:pointer}
  input,select,textarea{
    font:inherit; color:var(--text); background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:.5rem .65rem; width:100%;
    color-scheme:dark;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(201,162,78,.45); outline-offset:1px}
  ::placeholder{color:rgba(194,161,121,.55)}

  header{
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
    padding:.9rem 1.2rem; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #1A140C, var(--bg));
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:baseline; gap:.6rem}
  .brand b{font-size:1.25rem; letter-spacing:.06em; color:var(--gold)}
  .brand span{color:var(--muted); font-size:.85rem}
  .who{margin-inline-start:auto; color:var(--muted); font-size:.8rem}
  .btn{
    background:var(--gold); color:#231A0E; border:none; border-radius:999px;
    padding:.5rem 1.1rem; font-weight:700;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn--ghost{background:transparent; color:var(--gold); border:1px solid var(--line)}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.8rem; padding:1rem 1.2rem}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:.8rem 1rem}
  .kpi b{display:block; font-size:1.5rem; color:var(--ivory)}
  .kpi span{color:var(--muted); font-size:.8rem}
  .kpi.gold b{color:var(--gold)}

  nav.tabs{display:flex; gap:.4rem; padding:0 1.2rem; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
  nav.tabs button{white-space:nowrap}
  nav.tabs button{
    background:none; border:none; color:var(--muted); padding:.6rem 1rem;
    border-bottom:2px solid transparent; font-weight:600;
  }
  nav.tabs button.on{color:var(--gold); border-bottom-color:var(--gold)}

  .filters{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; padding:.9rem 1.2rem}
  .filters .search{max-width:280px}
  .chips{display:flex; gap:.35rem; flex-wrap:wrap}
  .chip{
    background:var(--panel); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:.3rem .8rem; font-size:.82rem;
  }
  .chip.on{color:#231A0E; background:var(--gold); border-color:var(--gold); font-weight:700}
  .chip.ex{color:#FFD9D2; background:rgba(201,60,40,.4); border-color:transparent; text-decoration:line-through; font-weight:700}
  .filters select{width:auto}
  label.toggle{display:flex; gap:.35rem; align-items:center; color:var(--muted); font-size:.85rem; white-space:nowrap}
  label.toggle input{width:auto}
  .count{color:var(--muted); font-size:.8rem; margin-inline-start:auto}

  .wrap{padding:0 1.2rem 4rem}
  .tablebox{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--panel)}
  table{border-collapse:collapse; width:100%; min-width:960px}
  th,td{padding:.55rem .7rem; text-align:start; border-bottom:1px solid var(--line); white-space:nowrap}
  th{color:var(--muted); font-size:.78rem; font-weight:600; position:sticky; top:0; background:var(--panel); z-index:1}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:rgba(201,162,78,.06)}
  td.num{font-variant-numeric:tabular-nums}
  .badge{border-radius:999px; padding:.15rem .6rem; font-size:.76rem; font-weight:700; display:inline-block}
  .muted{color:var(--muted)}
  .wa{
    display:inline-grid; place-items:center; width:1.7rem; height:1.7rem; border-radius:999px;
    border:1px solid var(--line); color:var(--ok); text-decoration:none; font-size:.9rem;
  }
  .wa:hover{border-color:var(--ok)}
  .empty{padding:2.2rem; text-align:center; color:var(--muted)}

  /* drawer */
  .scrim{position:fixed; inset:0; background:rgba(10,7,4,.6); backdrop-filter:blur(2px); z-index:30; display:none}
  /* Physical coordinates on purpose: translateX is physical, so the inset must be too
     (mixing logical insets with physical transforms is the RTL bug documented in
     ASSET-ANALYSIS §Phase 5.1). Drawer lives on the LEFT edge (inline-end in RTL). */
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:min(560px,100vw);
    background:var(--panel); border-right:1px solid var(--line); z-index:31;
    transform:translateX(-110%); visibility:hidden;
    transition:transform .25s ease, visibility 0s .25s;
    display:flex; flex-direction:column;
  }
  .drawer.open{transform:none; visibility:visible; transition:transform .25s ease}
  .scrim.open{display:block}
  .drawer header{position:static; background:var(--panel-2); padding:.8rem 1.1rem}
  .drawer h2{margin:0; font-size:1.05rem; color:var(--gold)}
  .drawer .body{overflow-y:auto; padding:1rem 1.1rem; display:grid; grid-template-columns:1fr 1fr; gap:.7rem .8rem; align-content:start}
  .drawer .full{grid-column:1 / -1}
  .field label{display:block; color:var(--muted); font-size:.76rem; margin-bottom:.25rem}
  .drawer footer{
    padding: .8rem 1.1rem; border-top:1px solid var(--line); display:flex; gap:.6rem; align-items:center;
    background:var(--panel-2);
  }
  .drawer footer .meta{color:var(--muted); font-size:.72rem; margin-inline-start:auto; text-align:end}

  /* pricing manager + drawer intel */
  .pricing{display:grid; gap:1rem}
  .pricing table{min-width:0; width:100%}
  .pricing td{white-space:normal}
  .pricing input.name{max-width:240px}
  .pricing input.price{max-width:110px}
  .pricing select{width:auto}
  .addrow{display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; padding:.7rem}
  .addrow input{width:auto}
  .finhead{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:.4rem; padding:.2rem .2rem 0}
  .finhead b{color:var(--gold); font-size:.95rem}
  .finhead .muted{font-size:.82rem}
  .btn--sm{padding:.35rem .8rem; font-size:.82rem}
  .btn--danger{background:transparent; color:var(--warn); border:1px solid var(--line)}
  .intel{
    background:rgba(201,162,78,.07); border:1px solid var(--line); border-radius:10px;
    padding:.7rem .8rem; display:grid; gap:.45rem; font-size:.88rem;
  }
  .intel .ok{color:var(--ok)}
  .intel .busy{color:var(--warn)}
  .intel .actions{display:flex; gap:.5rem; flex-wrap:wrap}

  /* flags on dates that carry 2+ live bookings:
     red = one of them is a confirmed booking (real double-booking danger)
     amber = only unconfirmed requests compete on the date */
  .dateflag{color:#FF8A7A; font-weight:800}
  .dateflag::before{content:'⚠ '}
  .dateflag--soft{color:#E8C377}
  .dateflag--soft::before{content:'◔ '}

  /* totals row at the bottom of finance tables */
  tfoot td{
    border-top:2px solid rgba(201,162,78,.4); border-bottom:none;
    background:rgba(201,162,78,.07); font-weight:800; color:var(--ivory);
  }
  tfoot td:first-child{color:var(--gold)}

  /* catch-up list for completed events missing from the P&L: on a phone keep the client,
     the date, what was collected and the button — the rest would push the action into a
     horizontal scroll nobody would find */
  @media (max-width:720px){
    #finmiss th:nth-child(1), #finmiss td:nth-child(1),
    #finmiss th:nth-child(3), #finmiss td:nth-child(3),
    #finmiss th:nth-child(5), #finmiss td:nth-child(5){display:none}
  }

  /* quick date-availability check: a filter button that pops the calendar, a verdict
     banner, and any real booking on that date floated to the top and flagged red */
  .dc-wrap{position:relative; display:inline-flex}
  .dc-wrap #dateCheckInput{position:absolute; inset:0; width:100%; height:100%; opacity:0; pointer-events:none; padding:0; margin:0; border:0; min-width:0}
  .dc-chip{cursor:pointer; background:var(--gold); color:#231A0E; border-color:var(--gold); font-weight:700}
  .verdict{border-radius:var(--r); padding:.7rem 1rem; margin:0 0 .9rem; font-weight:700; display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; font-size:.95rem}
  .verdict small{font-weight:500; opacity:.85; font-size:.8rem}
  .verdict.taken{background:rgba(201,60,40,.16); color:#FFB3A6; border:1px solid rgba(201,60,40,.5)}
  .verdict.adv{background:rgba(127,179,201,.14); color:#A9D2E1; border:1px solid rgba(127,179,201,.4)}
  .verdict.soft{background:rgba(201,162,78,.12); color:var(--gold); border:1px solid var(--line)}
  .verdict.free{background:rgba(134,185,138,.16); color:#A6D6AA; border:1px solid rgba(134,185,138,.4)}
  #grid tbody tr.taken{background:rgba(201,60,40,.1)}
  #grid tbody tr.taken:hover{background:rgba(201,60,40,.16)}
  #grid tbody tr.taken>td:first-child{box-shadow:inset 3px 0 0 #E0533E}
  @media (max-width:720px){ #grid tbody tr.taken{border-inline-start:3px solid #E0533E} }

  /* ---------- التقويم: the month, built from the bookings themselves ----------
     Sunday-first, and RTL puts أحد in the rightmost column on its own — the grid is
     laid out in reading order and the document direction does the mirroring. */
  .cvhead{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; padding:.1rem .2rem}
  .cvhead .mon{font-size:1.05rem; font-weight:800; color:var(--gold); min-width:9.5rem; text-align:center}
  .cvnav{
    background:var(--panel); color:var(--gold); border:1px solid var(--line); border-radius:999px;
    width:2rem; height:2rem; display:grid; place-items:center; font-size:1.1rem; line-height:1;
  }
  .cvnav:hover{border-color:var(--gold)}
  .cvgrid{
    display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  }
  .cvdow{background:var(--panel-2); color:var(--muted); font-size:.75rem; font-weight:700; text-align:center; padding:.4rem .2rem}
  .cvcell{background:var(--panel); min-height:6.4rem; padding:.3rem; display:flex; flex-direction:column; gap:.22rem; position:relative}
  .cvcell.pad{background:rgba(30,23,15,.5)}
  .cvcell.past{opacity:.6}
  .cvcell.today{box-shadow:inset 0 0 0 2px var(--gold)}
  /* negative x = the bar sits on the right edge, which is the start edge on this RTL page */
  .cvcell.clash{box-shadow:inset -3px 0 0 #E0533E}
  .cvcell.clash.today{box-shadow:inset 0 0 0 2px var(--gold), inset -3px 0 0 #E0533E}
  .cvnum{font-size:.78rem; color:var(--muted); font-variant-numeric:tabular-nums; position:relative; z-index:1; pointer-events:none}
  .cvcell.today .cvnum{color:var(--gold); font-weight:800}
  /* the whole empty area of a day is a "new booking on this date" target */
  .cvadd{position:absolute; inset:0; border:none; background:transparent}
  .cvcell:hover .cvadd{background:rgba(201,162,78,.05)}
  .cvchips{display:flex; flex-direction:column; gap:.18rem; position:relative; z-index:1}
  .cvchip{
    display:block; width:100%; text-align:start; border:none; border-radius:6px;
    padding:.16rem .34rem; padding-inline-start:.5rem; font-size:.72rem; font-weight:700;
    line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cvshort{display:none}
  .cvchip.off{text-decoration:line-through; opacity:.55}
  /* a busy day shows three and counts the rest; +N opens the day in place */
  .cvchips > .cvchip:nth-child(n+4){display:none}
  .cvcell.open .cvchips > .cvchip{display:block}
  .cvmore{background:none; border:none; color:var(--muted); font-size:.7rem; text-align:start; padding:0 .34rem}
  .cvmore:hover{color:var(--gold)}

  /* the same month as a list — the phone's primary view, and a useful running order on desktop */
  .cvagenda{border:1px solid var(--line); border-radius:var(--r); background:var(--panel); overflow:hidden}
  .cvday + .cvday{border-top:1px solid var(--line)}
  .cvdate{padding:.45rem .8rem; background:var(--panel-2); color:var(--gold); font-size:.82rem; font-weight:800}
  .cvitem{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; padding:.5rem .8rem; padding-inline-start:1rem; cursor:pointer; border-top:1px solid rgba(201,162,78,.08)}
  .cvitem:hover{background:rgba(201,162,78,.06)}
  .cvitem .t{font-variant-numeric:tabular-nums; color:var(--muted); font-size:.8rem; min-width:3.1rem}
  .cvitem .n{font-weight:700}
  .cvitem .s{margin-inline-start:auto}

  @media (max-width:720px){
    /* A phone column is ~50px, so the full name would truncate to nothing — the chip
       switches to the first name alone (.cvshort) and keeps its colour bar. Everything
       around it gives up a little size so the name has room. */
    .cvcell{min-height:4rem; padding:.18rem; gap:.14rem}
    .cvchip{font-size:.6rem; padding:.1rem .16rem; padding-inline-start:.32rem; border-radius:4px; line-height:1.32}
    .cvfull{display:none}
    .cvshort{display:inline}
    .cvmore{font-size:.58rem; padding:0 .16rem}
    .cvnum{font-size:.66rem}
    .cvhead .mon{min-width:6.5rem; font-size:.95rem}
    .cvdow{font-size:.64rem; padding:.3rem .05rem}
    .cvitem{gap:.35rem; padding:.5rem .55rem; padding-inline-start:.8rem}
    .cvitem .t{min-width:2.6rem; font-size:.76rem}
  }

  /* expandable row editor (finance / inventory) */
  .editgrid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.6rem;
    padding:.8rem; background:var(--panel-2); border-radius:10px; margin:.3rem 0;
  }
  .editgrid .acts{grid-column:1 / -1; display:flex; gap:.5rem; flex-wrap:wrap}
  tr.fedit>td{background:rgba(201,162,78,.05); white-space:normal}
  .neg{color:var(--warn)} .pos{color:var(--ok)}

  /* analytics bars */
  .bar{display:grid; grid-template-columns:minmax(90px,auto) 1fr auto; gap:.6rem; align-items:center; padding:.25rem 0; font-size:.85rem}
  .bar i{display:block; height:8px; background:var(--gold); border-radius:4px; min-width:2px}
  .bar b{font-variant-numeric:tabular-nums}
  .statbox{padding:.8rem 1rem}
  .statbox>b{display:block; color:var(--muted); font-size:.8rem; margin-bottom:.4rem}

  /* smartphone: the four KPIs as a 2×2 block. At 390px the auto-fit track (170px + gap)
     misses two columns by a hair and stacks them one per row, pushing every tab a full
     screen down before you reach it. */
  @media (max-width:720px){
    .kpis{grid-template-columns:1fr 1fr; gap:.6rem; padding:.7rem .9rem}
    .kpi{padding:.6rem .7rem}
    .kpi b{font-size:1.3rem}
    .kpi span{font-size:.74rem}
  }

  /* smartphone: bookings as compact 2-line rows — name+date / city+status.
     Tap opens the drawer with everything else. ~9 clients per screen. */
  @media (max-width:720px){
    #grid{min-width:0}
    #gridbox{border:1px solid var(--line); border-radius:12px; background:var(--panel)}
    #grid thead{display:none}
    #grid, #grid tbody{display:block}
    #grid tbody tr{
      display:grid; grid-template-columns:1fr auto; column-gap:.9rem; row-gap:.1rem;
      align-items:baseline; padding:.55rem .8rem; border-bottom:1px solid var(--line);
    }
    #grid tbody td{display:none; border:none; padding:0; white-space:normal; text-align:start}
    #grid tbody td:nth-child(2){display:block; grid-column:1; grid-row:1; font-size:.95rem}
    #grid tbody td:nth-child(4){display:block; grid-column:2; grid-row:1; text-align:end; font-size:.88rem}
    #grid tbody td:nth-child(6){display:block; grid-column:1; grid-row:2; color:var(--muted); font-size:.8rem}
    #grid tbody td:nth-child(8){display:block; grid-column:2; grid-row:2; justify-self:end}
    #grid tbody td:nth-child(8) .badge{font-size:.68rem; padding:.08rem .5rem}
    #grid tbody td .wa{display:none}
  }

  #toast{
    position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#231A0E; font-weight:700; border-radius:999px;
    padding:.55rem 1.2rem; z-index:50; display:none;
  }
  #toast.err{background:var(--warn); color:#2B120C}
  #veil{position:fixed; inset:0; display:none; place-items:center; background:var(--bg); z-index:60; text-align:center; padding:2rem}
  @media (max-width:640px){ .drawer .body{grid-template-columns:1fr} .filters .search{max-width:none; flex:1} }
</style>
</head>
<body>

<header>
  <div class="brand"><b>سراب</b><span>مكتب الحجوزات</span></div>
  <button class="btn" id="newBtn">+ حجز جديد</button>
  <button class="btn btn--ghost" id="refreshBtn" title="تحديث">تحديث</button>
  <span class="who" id="who"></span>
</header>

<section class="kpis" id="kpis"></section>

<nav class="tabs" id="tabs">
  <button data-tab="bookings" class="on">الحجوزات</button>
  <button data-tab="calendar">التقويم</button>
  <button data-tab="callback">إعادة الاتصال</button>
  <button data-tab="whatsapp">واتساب</button>
  <button data-tab="finance">المالية</button>
  <button data-tab="insights">التحليلات</button>
  <button data-tab="inventory">المخزون</button>
  <button data-tab="visitors">الزوار</button>
  <button data-tab="capi">ميتا CAPI</button>
  <button data-tab="cities">أسعار المدن</button>
</nav>

<section class="filters" id="filters">
  <input class="search" id="q" type="search" placeholder="بحث: اسم، هاتف، رقم، مدينة…">
  <span class="dc-wrap">
    <button type="button" class="btn btn--ghost btn--sm" id="dateCheckBtn" title="اختر تاريخاً لفحص توفّره فوراً">📅 فحص تاريخ</button>
    <input type="date" id="dateCheckInput" aria-label="اختر تاريخاً للفحص">
  </span>
  <span class="chip dc-chip" id="dateCheckChip" style="display:none"></span>
  <div class="chips" id="statusChips"></div>
  <select id="month"><option value="">كل الشهور</option></select>
  <label class="toggle"><input type="checkbox" id="upcoming"> القادمة فقط</label>
  <label class="toggle"><input type="checkbox" id="nopast"> إخفاء الماضية</label>
  <select id="order">
    <option value="date">حسب تاريخ المناسبة</option>
    <option value="new">الأحدث إضافةً</option>
  </select>
  <button class="btn btn--ghost btn--sm" id="csvBtn" title="تنزيل النتائج الحالية كملف CSV">CSV ⬇</button>
  <button class="btn btn--ghost btn--sm" id="calBtn" title="حالة الربط مع تقويم Google">🗓 تقويم Google</button>
  <span class="count" id="count"></span>
</section>

<main class="wrap">
  <div class="verdict" id="dateVerdict" style="display:none"></div>
  <div class="verdict" id="calBox" style="display:none"></div>
  <div class="tablebox" id="gridbox"><table id="grid">
    <thead><tr>
      <th>الرقم</th><th>الاسم</th><th>الهاتف</th><th>تاريخ المناسبة</th><th>النوع</th>
      <th>المدينة</th><th>القاعة</th><th>الحالة</th><th>الدفع</th><th>المتبقي</th><th>الطاقم</th>
    </tr></thead>
    <tbody></tbody>
  </table></div>
  <div class="pricing" id="calendar" style="display:none"></div>
  <div class="pricing" id="pricing" style="display:none"></div>
  <div class="pricing" id="finance" style="display:none"></div>
  <div class="pricing" id="insights" style="display:none"></div>
  <div class="pricing" id="inventory" style="display:none"></div>
  <div class="pricing" id="visitors" style="display:none"></div>
  <div class="pricing" id="capi" style="display:none"></div>
  <div class="pricing" id="whatsapp" style="display:none"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="تفاصيل الحجز">
  <header><h2 id="dTitle">حجز</h2></header>
  <div class="body" id="dBody"></div>
  <footer>
    <button class="btn" id="saveBtn">حفظ</button>
    <a class="btn btn--ghost" id="waBtn" target="_blank" rel="noopener">واتساب</a>
    <button class="btn btn--ghost" id="closeBtn">إغلاق</button>
    <button class="btn btn--danger btn--sm" id="delBtn" style="display:none">حذف</button>
    <span class="meta" id="dMeta"></span>
  </footer>
</aside>

<div id="toast" role="status"></div>
<div id="veil"><div>
  <h2 style="color:var(--gold)">الجلسة غير مصرّح بها</h2>
  <p class="muted">افتح المكتب عبر الرابط المحمي وسجّل الدخول ببريدك، ثم أعد تحميل الصفحة.</p>
</div></div>

<script>
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];

/*
  One status palette for the whole dashboard: [fill, text, pure hue].

  The original ~16% fills with the hue itself as the text were tuned for a wide desktop
  table cell. On a phone — a small badge on a dark card, or a chip in a 50px-wide calendar
  column — every one of them read as the same brown. These keep the exact same hues but
  roughly double the fill and lift the text to a near-white tint of it, so the six statuses
  are told apart at a glance and in sunlight. The third value is the undiluted colour, used
  for the solid bar on the start edge of calendar chips and agenda rows: the status still
  reads even when the name beside it has been truncated away.
*/
const STATUS_COLORS = {
  'استفسار':    ['rgba(194,161,121,.30)', '#F5E8D6', '#C2A179'],
  'عرض سعر':    ['rgba(201,162,78,.34)',  '#FAEFCE', '#C9A24E'],
  'مؤكد':       ['rgba(134,185,138,.36)', '#E4F5E6', '#86B98A'],
  'دفع العربون':['rgba(127,179,201,.36)', '#E1F1F8', '#7FB3C9'],
  'مكتمل':      ['rgba(190,150,104,.36)', '#F6E9D6', '#BE9668'],
  'ملغي':       ['rgba(201,123,106,.30)', '#FADDD6', '#C97B6A'],
};
const calColor = (s) => STATUS_COLORS[s] || ['rgba(194,161,121,.2)', 'var(--text)', 'var(--muted)'];

// calRealOnly starts ON: the calendar answers "what am I actually committed to?", so it
// opens on real bookings only. Unticking brings the استفسارات and عروض السعر back in.
const state = { meta:null, rows:[], conflicts:new Set(), confirmedClashes:new Set(), tab:'bookings', filters:{ q:'', statusIn:[], statusEx:[], month:'', upcoming:false, nopast:false, order:'date', dateCheck:'' }, editing:null, remainTouched:false, calMonth:null, calRows:[], calRealOnly:true };

async function api(path, opts={}) {
  const res = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  if (res.status === 403) { $('#veil').style.display='grid'; throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || res.status);
  return data;
}

const money = (v) => (v === null || v === undefined || v === '') ? '—'
  : new Intl.NumberFormat('en-US').format(Number(v)) + ' ₪';
const dmy = (iso) => {
  if (!iso) return '—';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso);
};
const waLink = (phone) => {
  const d = String(phone || '').replace(/\D/g, '');
  if (d.length < 9) return null;
  return 'https://wa.me/' + (d.startsWith('0') ? '972' + d.slice(1) : d);
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// الطاقم: one worker per separator (، , ; / +) — how many names were written.
const staffCount = (s) => String(s ?? '').split(/[,،;/+]/).filter((p) => p.trim()).length;
// Grid cell: the worker(s), with ×n whenever the recorded count says more than one.
const staffCell = (r) => {
  const names = String(r.staff || '').trim();
  const n = Number(r.staff_count);
  const times = Number.isFinite(n) && n > 1 ? ` <span class="muted">×${n}</span>` : '';
  if (names) return esc(names) + times;
  return Number.isFinite(n) && n > 0 ? `<span class="muted">${n} عمال</span>` : '—';
};

// The fullest name we can show. The office edits first_name/last_name but the legacy
// `name` field (set once from the website form) is never re-synced — so a record can
// carry both a short/blank `name` and a complete first+last. Prefer first+last when both
// are present (never shortening a longer stored name, e.g. a 3-part website name), then
// fall back to `name`, then to whichever part exists. Fixes short names in the grid and
// blank names in CAPI.
const fullName = (r) => {
  const parts = [r.first_name, r.last_name].filter(Boolean).join(' ').trim();
  const nm = String(r.name || '').trim();
  if (parts && (!nm || parts.length >= nm.length)) return parts;
  return nm || parts || '—';
};

function toast(msg, err=false) {
  const t = $('#toast');
  t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600);
}

function renderChips() {
  const box = $('#statusChips');
  const counts = state.meta.statusCounts || {};
  const statuses = (state.meta.options.status || []);
  const f = state.filters;
  const cls = (s) => f.statusIn.includes(s) ? ' on' : f.statusEx.includes(s) ? ' ex' : '';
  box.innerHTML = `<button class="chip${!f.statusIn.length && !f.statusEx.length ? ' on' : ''}" data-s="">الكل</button>` +
    statuses.map((s) => `<button class="chip${cls(s)}" data-s="${esc(s)}"
      title="اضغط: تضمين · مرة ثانية: استبعاد ✕ · ثالثة: إلغاء">${esc(s)}${counts[s] ? ` · ${counts[s]}` : ''}</button>`).join('');
  $$('.chip', box).forEach((b) => b.onclick = () => {
    clearDateCheck(false);
    const s = b.dataset.s;
    if (!s) { f.statusIn = []; f.statusEx = []; }
    else if (f.statusIn.includes(s)) { f.statusIn = f.statusIn.filter((x) => x !== s); f.statusEx.push(s); }
    else if (f.statusEx.includes(s)) { f.statusEx = f.statusEx.filter((x) => x !== s); }
    else f.statusIn.push(s);
    renderChips();
    loadRows();
  });
}

function renderMonths() {
  const sel = $('#month');
  const cur = state.filters.month;
  sel.innerHTML = '<option value="">كل الشهور</option>' +
    (state.meta.months || []).map((m) => `<option value="${m}" ${m===cur?'selected':''}>${m.split('-')[1]} / ${m.split('-')[0]}</option>`).join('');
}

function badge(s) {
  // The outline does most of the work at badge size — a tinted fill alone still reads as
  // "some brown pill" on a phone; a crisp edge in the pure hue names the status instantly.
  const [bg, fg, pure] = calColor(s);
  return `<span class="badge" style="background:${bg};color:${fg};border:1px solid ${pure}66">${esc(s || '—')}</span>`;
}

// Status priority for the date check: real bookings first, then advance, inquiries, cancelled last.
const DATE_RANK = (s) => s === 'مؤكد' || s === 'مكتمل' ? 0 : s === 'دفع العربون' ? 1 : s === 'ملغي' ? 3 : 2;

// Verdict banner for the quick date-availability check (فحص تاريخ).
function renderVerdict(iso) {
  const el = $('#dateVerdict');
  const count = (test) => state.rows.filter(test).length;
  const actual = count((r) => r.status === 'مؤكد' || r.status === 'مكتمل');
  const adv = count((r) => r.status === 'دفع العربون');
  const soft = count((r) => r.status === 'استفسار' || r.status === 'عرض سعر');
  const d = dmy(iso);
  let cls, msg;
  if (actual) { cls = 'taken'; msg = `🔴 التاريخ ${d} محجوز — ${actual} حجز مؤكد <small>الصفوف الحمراء أعلى الجدول</small>`; }
  else if (adv) { cls = 'adv'; msg = `🔵 التاريخ ${d} بانتظار دفع العربون (${adv}) <small>غير مؤكد بالكامل بعد</small>`; }
  else if (soft) { cls = 'soft'; msg = `🟡 التاريخ ${d} — استفسار / عرض سعر فقط (${soft}) <small>لا يوجد حجز مؤكد</small>`; }
  else { cls = 'free'; msg = `🟢 التاريخ ${d} متاح <small>${state.rows.length ? 'لا شيء عليه سوى حجوزات ملغاة' : 'لا شيء على هذا التاريخ'}</small>`; }
  el.className = 'verdict ' + cls;
  el.innerHTML = `<span>${msg}</span><button type="button" class="btn btn--ghost btn--sm" id="dcAnother" style="margin-inline-start:auto">فحص تاريخ آخر</button>`;
  el.style.display = '';
  $('#dcAnother').onclick = openDatePicker;
}

function renderRows() {
  const tb = $('#grid tbody');
  const dc = state.filters.dateCheck;
  if (dc) {
    // date-availability check: float the real bookings to the top, verdict banner above
    state.rows.sort((a, b) => DATE_RANK(a.status) - DATE_RANK(b.status)
      || String(a.start_time || '').localeCompare(String(b.start_time || '')) || a.id - b.id);
    renderVerdict(dc);
  } else {
    $('#dateVerdict').style.display = 'none';
  }
  if (!state.rows.length) {
    tb.innerHTML = `<tr><td colspan="11"><div class="empty">لا نتائج</div></td></tr>`;
  } else {
    tb.innerHTML = state.rows.map((r) => {
      const wa = waLink(r.phone);
      const taken = dc && (r.status === 'مؤكد' || r.status === 'مكتمل');
      const clash = !dc && r.event_date && r.status !== 'ملغي' && state.conflicts.has(r.event_date);
      const hard = clash && state.confirmedClashes.has(r.event_date);
      const flagCls = hard ? ' dateflag' : clash ? ' dateflag dateflag--soft' : '';
      const flagTitle = hard ? 'التاريخ عليه حجز مؤكد + طلبات أخرى — خطر حجز مزدوج!'
        : clash ? 'أكثر من طلب غير مؤكد على هذا التاريخ' : '';
      return `<tr data-id="${r.id}"${taken ? ' class="taken"' : ''}>
        <td data-l="الرقم" class="num muted">${esc(r.booking_no || '—')}</td>
        <td data-l="الاسم"><b>${esc(fullName(r))}</b>${r.source==='website' ? ' <span class="muted" style="font-size:.7rem">من الموقع</span>':''}</td>
        <td data-l="الهاتف" class="num">${esc(r.phone || '—')} ${wa ? `<a class="wa" href="${wa}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="واتساب">✆</a>` : ''}</td>
        <td data-l="تاريخ المناسبة" class="num${flagCls}"${flagTitle ? ` title="${flagTitle}"` : ''}>${dmy(r.event_date)}</td>
        <td data-l="النوع">${esc(r.occasion || '—')}</td>
        <td data-l="المدينة">${esc(r.city || '—')}</td>
        <td data-l="القاعة">${esc(r.venue || '—')}</td>
        <td data-l="الحالة">${badge(r.status)}</td>
        <td data-l="الدفع">${esc(r.payment_status || '—')}</td>
        <td data-l="المتبقي" class="num">${money(r.remaining)}</td>
        <td data-l="الطاقم">${staffCell(r)}</td>
      </tr>`;
    }).join('');
    $$('tr[data-id]', tb).forEach((tr) => tr.onclick = () => openDrawer(Number(tr.dataset.id)));
  }
  const due = state.rows.reduce((s, r) => s + (r.status !== 'ملغي' && Number(r.remaining) > 0 ? Number(r.remaining) : 0), 0);
  $('#count').textContent = `${state.rows.length} سجل · متبقٍ ${money(due)}`;
}

async function loadPricing() {
  const { tiers } = await api('/office/api/pricing');

}

function tierSelect(cls, selected) {
  return `<select class="${cls}">${TIERS.map((t) =>

function renderPricing() {
  const box = $('#pricing');
  const nCities = TIERS.reduce((n, t) => n + t.cities.length, 0);
  box.innerHTML = `
    <div class="tablebox"><table>
      <thead><tr><th>الفئة (حسب المسافة/المنطقة)</th><th>السعر</th><th>عدد المدن</th><th></th></tr></thead>
      <tbody>${TIERS.map((t) => `<tr data-tier="${t.id}">

      </tbody>
    </table>
    <div class="addrow">
      <input class="name" id="ntName" placeholder="اسم فئة جديدة (مثال: المنطقة البعيدة)">
      <input class="price" id="ntPrice" type="number" step="any" placeholder="السعر">
      <button class="btn btn--sm" id="addTier">+ إضافة فئة</button>
    </div></div>

    <div class="tablebox"><table>
      <thead><tr><th>المدينة</th><th>الفئة — غيّرها لنقل المدينة</th><th>السعر</th><th></th></tr></thead>
      <tbody>${TIERS.flatMap((t) => t.cities.map((c) => `<tr data-city="${c.id}">
        <td>${esc(c.name)}</td>
        <td>${tierSelect('moveCity', t.id)}</td>
        <td class="num">${money(t.price)}</td>
        <td><button class="btn btn--sm btn--danger delCity" data-name="${esc(c.name)}">✕</button></td>
      </tr>`)).join('')}
      </tbody>
    </table>
    <div class="addrow">
      <input class="name" id="ncName" placeholder="مدينة جديدة…">
      ${TIERS.length ? tierSelect('ncTier', TIERS[0].id) : ''}
      <button class="btn btn--sm" id="addCity">+ إضافة مدينة</button>
    </div></div>`;

  $('#count').textContent = `${TIERS.length} فئات · ${nCities} مدينة`;

  const apply = (r, msg) => { TIERS = r.tiers; renderPricing(); loadMeta().catch(() => {}); toast(msg); };
  const send = (method, body, okMsg, errMsg) =>
    api('/office/api/pricing', { method, body: JSON.stringify(body) })

      .catch((e) => { if (e.message !== 'unauthorized') toast(errMsg, true); });

  $$('tr[data-tier]', box).forEach((tr) => {
    const id = Number(tr.dataset.tier);
    $('.saveTier', tr).onclick = () =>
      send('PATCH', { type: 'tier', id, name: $('.name', tr).value, price: $('.price', tr).value }, 'تم الحفظ ✓', 'لم يُحفظ — تحقق من القيم');

  });

    send('POST', { type: 'tier', name: $('#ntName').value, price: $('#ntPrice').value }, 'أُضيفت الفئة ✓', 'تحقق من الاسم والسعر');

    $('.moveCity', tr).onchange = (e) =>
      send('PATCH', { type: 'city', id, tier_id: Number(e.target.value) }, 'نُقلت المدينة ✓', 'لم تُنقل');

      send('DELETE', { type: 'city', id }, 'حُذفت ✓', 'لم تُحذف');
  });
  $('#addCity').onclick = () => {
    const sel = $('.ncTier', box);
    send('POST', { type: 'city', name: $('#ncName').value, tier_id: sel ? Number(sel.value) : 0 }, 'أُضيفت المدينة ✓', 'المدينة موجودة أو الاسم فارغ');
  };
}

function egrid(def, obj) {
  return '<div class="editgrid">' + def.map(([k, l, kind]) => {
    const v = obj && obj[k] != null ? obj[k] : '';
    let input;
    if (kind === 'date') input = `<input data-k="${k}" type="date" value="${esc(v)}">`;
    else if (kind === 'number') input = `<input data-k="${k}" type="number" step="any" value="${esc(v)}">`;
    else if (kind && kind.startsWith('list:')) {
      const name = kind.slice(5);
      const opts = (state.meta && state.meta.options[name]) || [];
      input = `<input data-k="${k}" list="dle_${name}" value="${esc(v)}"><datalist id="dle_${name}">${opts.map((o) => `<option value="${esc(o)}">`).join('')}</datalist>`;
    } else input = `<input data-k="${k}" value="${esc(v)}">`;
    return `<div class="field"><label>${l}</label>${input}</div>`;
  }).join('') + `<div class="acts">
      <button class="btn btn--sm esave">${obj ? 'حفظ' : 'إضافة'}</button>
      ${obj ? '<button class="btn btn--sm btn--danger edel">حذف</button>' : ''}
      <button class="btn btn--ghost btn--sm ecancel">إلغاء</button>
    </div></div>`;
}
const collectGrid = (el) => { const o = {}; $$('input[data-k]', el).forEach((i) => o[i.dataset.k] = i.value); return o; };

// Expandable rows: click a row → inline editor; the add button prepends an empty one.
function wireEditors(tablebox, def, send) {
  const closeEditors = () => $$('tr.fedit', tablebox).forEach((e) => e.remove());
  $$('tr.frow', tablebox).forEach((tr) => tr.onclick = () => {
    const wasOpen = tr.nextElementSibling && tr.nextElementSibling.classList.contains('fedit');
    closeEditors();
    if (wasOpen) return;
    const obj = JSON.parse(tr.dataset.obj);
    const ed = document.createElement('tr');
    ed.className = 'fedit';
    ed.innerHTML = `<td colspan="${tr.children.length}">${egrid(def, obj)}</td>`;
    tr.after(ed);
    $('.esave', ed).onclick = () => send('PATCH', { id: obj.id, ...collectGrid(ed) });
    $('.edel', ed).onclick = () => confirm('حذف هذا السطر نهائياً؟') && send('DELETE', { id: obj.id });
    $('.ecancel', ed).onclick = closeEditors;
  });
  const add = $('.fadd', tablebox);
  if (add) add.onclick = () => {
    closeEditors();
    const tbody = tablebox.querySelector('tbody');
    const colspan = tablebox.querySelectorAll('thead th').length;
    const ed = document.createElement('tr');
    ed.className = 'fedit';
    ed.innerHTML = `<td colspan="${colspan}">${egrid(def, null)}</td>`;
    tbody.prepend(ed);
    $('.esave', ed).onclick = () => send('POST', collectGrid(ed));
    $('.ecancel', ed).onclick = closeEditors;
  };
}

function bars(title, rows) {
  const max = Math.max(1, ...rows.map((r) => r.n));
  return `<div class="tablebox statbox"><b>${title}</b>
    ${rows.map((r) => `<div class="bar"><span>${esc(String(r.k))}</span><i style="width:${(r.n / max * 100).toFixed(0)}%"></i><b>${r.n}</b></div>`).join('')
      || '<div class="empty">لا بيانات بعد</div>'}</div>`;
}

const intlPhone = (p) => { const d = String(p || '').replace(/\D/g, ''); return d.startsWith('0') ? '972' + d.slice(1) : d; };
// The base Meta source plus every campaign the owner added in the CAPI tab — a booking
// carrying ANY of these in مصدر العميل is a Meta conversion.
const LEGACY_META = 'إعلان ممول (Meta)';
const metaSources = () => [LEGACY_META, ...(state.meta?.options?.meta_campaign || [])];
const fromMeta = (r) => {
  if (metaSources().includes(r.lead_source)) return true;
  try { return JSON.parse(r.extra || '{}').attribution?.fbclid === 1 } catch { return false }
};

// Split the Meta-sourced bookings so the real conversion count is never muddied by the
// ones still on a deposit. مؤكد + مكتمل = 100%-approved, actual bookings; دفع العربون =
// advance paid, still awaiting full payment & confirmation.
let CAPI_CONF = [];
let CAPI_ADV = [];
let CAPI_ALL = 0;
let CAPI_ROWS = [];
async function loadCapi() {
  // All statuses, so the per-campaign table can count inquiries too (the funnel top).
  const { rows } = await api('/office/api/bookings?order=date&limit=1000');
  CAPI_ROWS = rows;
  CAPI_ALL = rows.filter((r) => ['مؤكد', 'دفع العربون', 'مكتمل'].includes(r.status)).length;
  // The workbook's rule: only Meta-sourced customers who actually BOOKED enter CAPI.
  // Setting مصدر العميل to the Meta source or any campaign adds a booking automatically.
  const meta = rows.filter(fromMeta);
  CAPI_CONF = meta.filter((r) => r.status === 'مؤكد' || r.status === 'مكتمل');
  CAPI_ADV = meta.filter((r) => r.status === 'دفع العربون');
  renderCapi();
}

// Per-campaign funnel over every Meta-sourced booking: total leads (any status),
// confirmed conversions + their value, deposits pending. Attribution-only rows
// (fbclid, no listed source) fold into the base Meta entry.
function campaignStats() {
  const byCamp = new Map(metaSources().map((c) => [c, { camp: c, leads: 0, conf: 0, confVal: 0, adv: 0 }]));
  for (const r of CAPI_ROWS) {
    if (!fromMeta(r)) continue;
    const s = byCamp.get(byCamp.has(r.lead_source) ? r.lead_source : LEGACY_META);
    s.leads++;
    if (r.status === 'مؤكد' || r.status === 'مكتمل') { s.conf++; s.confVal += Number(r.price) || 0; }
    else if (r.status === 'دفع العربون') s.adv++;
  }
  return [...byCamp.values()];
}

async function loadMeta() {
  state.meta = await api('/office/api/meta');
  $('#who').textContent = state.meta.email || '';
  // Google Calendar is optional and currently unconfigured — its button only appears once
  // the secrets are installed, so the dashboard never advertises a feature that isn't on.
  $('#calBtn').style.display = state.meta.google_calendar ? '' : 'none';
  renderKpis(); renderChips(); renderMonths();
}

async function loadRows() {
  const f = state.filters;
  const p = new URLSearchParams();
  if (f.dateCheck) {
    // exact-date availability check overrides the other filters — show everything on that day
    p.set('date', f.dateCheck);
    p.set('order', 'date');
  } else {
    if (state.tab === 'callback') p.set('callback', '1');
    if (f.q) p.set('q', f.q);
    if (f.statusIn.length) p.set('status', f.statusIn.join(','));
    if (f.statusEx.length) p.set('xstatus', f.statusEx.join(','));
    if (f.month) p.set('month', f.month);
    if (f.upcoming) p.set('upcoming', '1');
    if (f.nopast) p.set('nopast', '1');
    p.set('order', f.order);
  }
  const data = await api('/office/api/bookings?' + p);
  state.rows = data.rows;
  state.conflicts = new Set(data.conflict_dates || []);
  state.confirmedClashes = new Set(data.confirmed_clash_dates || []);
  $('#grid thead').innerHTML = GRID_HEAD;
  renderRows();
}

  ['booked_at', 'تاريخ الحجز (يُسجَّل تلقائياً عند التأكيد)', 'date'],

];

function fieldHtml([key, label, kind]) {
  const full = kind === 'textarea' ? ' full' : '';
  let input;
  if (kind === 'ro') input = `<input id="f_${key}" readonly style="opacity:.65">`;
  else if (kind === 'date') input = `<input id="f_${key}" type="date">`;
  else if (kind === 'number') input = `<input id="f_${key}" type="number" step="any" inputmode="decimal">`;
  else if (kind === 'check') input = `<input id="f_${key}" type="checkbox" style="width:auto;height:1.2rem">`;
  else if (kind === 'textarea') input = `<textarea id="f_${key}" rows="3"></textarea>`;
  else if (kind && kind.startsWith('select:')) {
    const opts = state.meta.options[kind.slice(7)] || [];
    input = `<select id="f_${key}"><option value=""></option>${opts.map((o) => `<option>${esc(o)}</option>`).join('')}</select>`;
  } else if (kind && kind.startsWith('combo:')) {
    // Real dropdown (full list, never clipped, native mobile picker) + inline "add new".
    const opts = state.meta.options[kind.slice(6)] || [];
    input = `<select id="f_${key}"><option value=""></option>${opts.map((o) => `<option>${esc(o)}</option>`).join('')}<option value="__add__">➕ نوع آخر…</option></select>`;
  } else if (kind && kind.startsWith('list:')) {
    const name = kind.slice(5);
    const opts = name === 'cities' ? (state.meta.cities || []).map((c) => c.name)
      : name === 'venues' ? (state.meta.venues || [])
      : name === 'staff' ? (state.meta.staff || [])
      : (state.meta.options[name] || []);
    input = `<input id="f_${key}" list="dl_${name}"><datalist id="dl_${name}">${opts.map((o) => `<option value="${esc(o)}">`).join('')}</datalist>`;
  } else input = `<input id="f_${key}">`;
  return `<div class="field${full}"><label for="f_${key}">${label}</label>${input}</div>`;
}

    + `\nيسعدنا نأكدلكم الحجز — أي سؤال إحنا جاهزين! 📸`,
  he: (o) => `שלום${o.n ? ' ' + o.n : ''} 🌟 תודה שפניתם ל-SARAB!`
    + (o.free ? `\nהתאריך ${o.d} פנוי ✓` : '')
    + (o.p ? `\nהמחיר ל${o.c}: ${o.p} ₪` : '')
    + `\nנשמח לסגור לכם את התאריך — לכל שאלה אנחנו כאן! 📸`,

async function loadIntel() {
  const box = $('#intel');
  if (!box) return;
  const date = $('#f_event_date').value;
  const cityTxt = $('#f_city').value || $('#f_venue').value;
  if (!date && !cityTxt) { box.style.display = 'none'; return; }
  let conflicts = [], match = null;
  try {
    const p = new URLSearchParams({ date, city: cityTxt });
    if (state.editing) p.set('exclude', state.editing);
    ({ conflicts, match } = await api('/office/api/intel?' + p));
  } catch { return; }

  const free = !!date && !conflicts.length;
  const dateLine = !date ? '' : free
    ? `<div class="ok">✓ التاريخ ${dmy(date)} متاح</div>`
    : `<div class="busy">⚠ على هذا التاريخ: ${conflicts.map((c) =>
        `${esc(c.booking_no || '#' + c.id)} ${esc(c.name || '')} (${esc(c.status)})${c.start_time ? ' · ' + esc(c.start_time) : ''}`).join(' — ')}</div>`;
  const priceLine = match
    ? `<div>💰 سعر <b>${esc(match.name)}</b>: <b>${money(match.price)}</b> <span class="muted">(${esc(match.tier)})</span></div>`
    : (cityTxt ? '<div class="muted">المدينة غير موجودة في قائمة الأسعار — حدّد السعر يدوياً</div>' : '');
  const wa = waLink($('#f_phone').value);
  const canReply = wa && (free || match);
  box.innerHTML = `${dateLine}${priceLine}<div class="actions">
    ${match ? `<button type="button" class="btn btn--sm" id="usePrice">اعتماد السعر ${money(match.price)}</button>` : ''}
    ${canReply ? `<button type="button" class="btn btn--sm btn--ghost" id="waReply">رد جاهز عبر واتساب</button>` : ''}
  </div>`;
  box.style.display = '';

  if (match) $('#usePrice').onclick = () => {
    $('#f_price').value = match.price;
    if (!state.remainTouched) {
      const d = parseFloat($('#f_deposit').value) || 0;
      $('#f_remaining').value = match.price - d;
    }
    toast('تم اعتماد السعر — لا تنسَ الحفظ');
  };
  if (canReply) $('#waReply').onclick = () => {
    const row = state.editing ? state.rows.find((r) => r.id === state.editing) : null;
    const lang = (row && row.lang) || 'ar';
    const first = $('#f_first_name').value || ((row && row.name) || '').split(' ')[0] || '';
    const text = (REPLY[lang] || REPLY.ar)({
      n: first, d: dmy(date), free,
      c: match ? match.name : cityTxt, p: match ? match.price : null,
    });
    window.open(wa + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  };
}

// Open the editor for any booking id, even one not in the loaded grid rows (the
// واتساب tab edits bookings that may be outside the current filter/limit).
async function openDrawerById(id) {
  if (!state.rows.find((r) => r.id === id)) {
    try {
      const { row } = await api('/office/api/bookings/' + id);
      state.rows.push(row);
    } catch (e) { if (e.message !== 'unauthorized') toast('تعذّر فتح الحجز', true); return; }
  }
  openDrawer(id);
}

// `presetDate` starts a new booking on a chosen day — the التقويم tab passes the square
// that was clicked, so the date (and its availability intel) is already filled in.
function openDrawer(id, presetDate) {
  const row = id ? state.rows.find((r) => r.id === id) : null;
  state.editing = row ? row.id : null;
  state.remainTouched = false;
  state.staffTouched = false;
  $('#dTitle').textContent = row ? `${row.booking_no || '#' + row.id} — ${fullName(row)}` : 'حجز جديد';
  $('#dBody').innerHTML = '<div class="field full intel" id="intel" style="display:none"></div>' + F.map(fieldHtml).join('');
  for (const [key,, kind] of F) {
    const el = $('#f_' + key);
    const v = row ? row[key]
      : key === 'status' ? 'استفسار'
      : key === 'event_date' && presetDate ? presetDate
      : null;
    if (kind === 'check') { el.checked = v === 1 || v === true; continue; }
    // A stored value missing from the options list must never be silently blanked
    // (saving would erase it) — surface it as a real option instead.
    if (el.tagName === 'SELECT' && v && ![...el.options].some((o) => o.value === String(v))) {
      const o = document.createElement('option');
      o.value = o.textContent = String(v);
      el.appendChild(o);
    }
    el.value = v ?? '';
  }
  // occasion combo: choosing "➕ نوع آخر…" lets the owner type a brand-new type inline
  const occ = $('#f_occasion');
  if (occ && occ.tagName === 'SELECT') {
    let prev = occ.value;
    occ.addEventListener('change', () => {
      if (occ.value !== '__add__') { prev = occ.value; return; }
      const t = (prompt('اكتب نوع المناسبة الجديد:') || '').trim();
      if (t) {
        if (![...occ.options].some((o) => o.value === t)) occ.add(new Option(t, t), occ.options[occ.options.length - 1]);
        occ.value = t; prev = t;
      } else { occ.value = prev; }
    });
  }
  // remaining auto-recalcs from price − deposit (new AND existing bookings);
  // a manual edit of remaining wins for the rest of this drawer session
  $('#f_remaining').addEventListener('input', () => state.remainTouched = true);
  for (const k of ['price', 'deposit']) $('#f_' + k).addEventListener('input', () => {
    if (state.remainTouched) return;
    const p = parseFloat($('#f_price').value), d = parseFloat($('#f_deposit').value) || 0;
    if (Number.isFinite(p)) $('#f_remaining').value = p - d;
  });
  // عدد العمال follows the names written in الطاقم (one per separator) — same idiom as
  // المتبقي following السعر − العربون: a manual edit of the count wins from then on.
  $('#f_staff_count').addEventListener('input', () => state.staffTouched = true);
  $('#f_staff').addEventListener('input', () => {
    if (state.staffTouched) return;
    $('#f_staff_count').value = staffCount($('#f_staff').value) || '';
  });
  // live intel: availability for the chosen date + tier price for the city
  const intelDeb = (() => { let h; return () => { clearTimeout(h); h = setTimeout(loadIntel, 400); }; })();
  $('#f_event_date').addEventListener('change', loadIntel);
  $('#f_city').addEventListener('input', intelDeb);
  $('#f_venue').addEventListener('input', intelDeb);
  loadIntel();
  const wa = row && waLink(row.phone);
  $('#waBtn').style.display = wa ? '' : 'none';
  if (wa) $('#waBtn').href = wa;
  const del = $('#delBtn');
  del.style.display = row ? '' : 'none';
  del.onclick = !row ? null : () => {
    if (!confirm(`حذف ${row.booking_no || '#' + row.id} — ${fullName(row)} نهائياً؟ لا يمكن التراجع.`)) return;
    api('/office/api/bookings/' + row.id, { method: 'DELETE' })
      .then(() => { closeDrawer(); toast('حُذف ✓'); return Promise.all([loadMeta(), state.tab === 'calendar' ? loadCalendarTab() : loadRows()]); })
      .then(() => { if (state.tab === 'whatsapp') return loadWa(); })
      .catch((e) => { if (e.message !== 'unauthorized') toast('لم يُحذف', true); });
  };
  $('#dMeta').innerHTML = row
    ? `المصدر: ${esc(row.source || '—')} · أُضيف: ${dmy(row.created_at)}${row.lang ? ' · لغة الموقع: ' + esc(row.lang) : ''}`
      + (row.gcal_event_id
        ? ` · <a href="${esc(row.gcal_link || '#')}" target="_blank" rel="noopener" title="فتح الموعد في تقويم Google">🗓 في التقويم</a>`
        : '')
    : '';
  $('#drawer').classList.add('open'); $('#scrim').classList.add('open');
}

function closeDrawer() { $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }

async function save() {
  const body = {};
  for (const [key,, kind] of F) {
    if (kind === 'ro') continue;
    const el = $('#f_' + key);
    body[key] = kind === 'check' ? (el.checked ? 1 : 0) : el.value;
  }
  try {
    // A new city with a price auto-joins the price list — say so in the same toast.
    const cityNote = (r) => r.city_added ? ` · أُضيفت «${r.city_added}» لقائمة أسعار المدن` : '';
    // …and so does what happened in Google Calendar. A calendar failure never means the
    // booking was lost — the wording has to make that obvious.
    const CAL_NOTE = { created: ' · أُضيف لتقويم Google 🗓', updated: ' · حُدِّث في تقويم Google 🗓', removed: ' · أُزيل من تقويم Google' };
    const calNote = (r) => (r.calendar && r.calendar.ok === false) ? ' — لكنه لم يصل للتقويم' : (CAL_NOTE[r.calendar?.action] || '');
    const calFailed = (r) => r.calendar?.ok === false;
    if (state.editing) {
      const r = await api('/office/api/bookings/' + state.editing, { method: 'PATCH', body: JSON.stringify(body) });
      toast('تم الحفظ ✓' + cityNote(r) + calNote(r), calFailed(r));
    } else {
      const r = await api('/office/api/bookings', { method: 'POST', body: JSON.stringify(body) });
      toast(`أُنشئ ${r.row.booking_no} ✓` + cityNote(r) + calNote(r), calFailed(r));
    }
    closeDrawer();
    await Promise.all([loadMeta(), state.tab === 'calendar' ? loadCalendarTab() : loadRows()]);
    if (state.tab === 'whatsapp') await loadWa();
  } catch (e) {
    if (e.message !== 'unauthorized') toast('لم يتم الحفظ — حاول مجدداً', true);
  }
}

// ---------- 📅 التقويم — the month, built from the bookings themselves ----------
// No second source of truth: every dated booking IS a calendar entry, coloured by its
// الحالة. Clicking one opens the same drawer as the grid; clicking an empty day starts a
// new booking already carrying that date.
const AR_MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران',
  'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
const AR_DOW = ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
const REAL_STATUSES = ['مؤكد', 'دفع العربون', 'مكتمل'];

// The owner's own day, not UTC — at 01:00 in تموز, toISOString() still says yesterday,
// which would put the اليوم ring on the wrong square.
const localISO = (d = new Date()) =>
  new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

async function loadCalendarTab() {
  state.calMonth ||= localISO().slice(0, 7);
  const [data, soon] = await Promise.all([
    api(`/office/api/bookings?month=${state.calMonth}&order=date&limit=1000`),
    // Independent of the month on screen, so اليوم/غداً still shows on the 31st.
    api('/office/api/bookings?upcoming=1&order=date&limit=60'),
  ]);
  state.calRows = data.rows;
  state.conflicts = new Set(data.conflict_dates || []);
  state.confirmedClashes = new Set(data.confirmed_clash_dates || []);
  renderCalendarTab(soon.rows);
}

function shiftMonth(delta) {
  const [y, m] = state.calMonth.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  state.calMonth = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
  loadCalendarTab().catch((e) => { if (e.message !== 'unauthorized') toast('تعذّر تحميل الشهر', true); });
}

function renderCalendarTab(soonRows) {
  const box = $('#calendar');
  const [y, mNo] = state.calMonth.split('-').map(Number);
  const mIdx = mNo - 1;
  const T = localISO();
  const rows = state.calRows.filter((r) => !state.calRealOnly || REAL_STATUSES.includes(r.status));

  const byDate = new Map();
  for (const r of rows) {
    if (!r.event_date) continue;
    const k = String(r.event_date).slice(0, 10);
    if (!byDate.has(k)) byDate.set(k, []);
    byDate.get(k).push(r);
  }
  for (const list of byDate.values()) {
    list.sort((a, b) => String(a.start_time || '~').localeCompare(String(b.start_time || '~')) || a.id - b.id);
  }

  // Two labels, one chip: the full one on a desktop column, the first name alone on a
  // phone's ~50px column — where the full name would truncate to nothing readable.
  const chip = (r) => {
    const [bg, fg, bar] = calColor(r.status);
    const t = String(r.start_time || '').slice(0, 5);
    const name = fullName(r);
    const tip = [r.booking_no || '#' + r.id, name, r.city, r.status, r.venue].filter(Boolean).join(' · ');
    return `<button class="cvchip${r.status === 'ملغي' ? ' off' : ''}" data-id="${r.id}"
      style="background:${bg};color:${fg};box-shadow:inset -3px 0 0 ${bar}" title="${esc(tip)}"
      ><span class="cvfull">${t ? esc(t) + ' ' : ''}${esc(name)}</span><span
       class="cvshort">${esc(name.split(' ')[0])}</span></button>`;
  };

  // Leading blanks so the 1st lands on its real weekday; trailing blanks square the grid.
  // Padding cells stay empty rather than borrowing the neighbouring month — showing a day
  // whose bookings we didn't load would read as "nothing booked" when there may be plenty.
  const lead = new Date(Date.UTC(y, mIdx, 1)).getUTCDay();
  const days = new Date(Date.UTC(y, mIdx + 1, 0)).getUTCDate();
  const cells = Array(lead).fill(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);

  const cellHtml = (d) => {
    if (!d) return '<div class="cvcell pad"></div>';
    const iso = `${state.calMonth}-${String(d).padStart(2, '0')}`;
    const list = byDate.get(iso) || [];
    const clash = state.conflicts.has(iso);
    const hard = state.confirmedClashes.has(iso);
    const cls = ['cvcell', iso === T ? 'today' : '', iso < T ? 'past' : '', clash ? 'clash' : ''].filter(Boolean).join(' ');
    const tip = hard ? 'حجز مؤكد + طلبات أخرى على نفس التاريخ — خطر حجز مزدوج'
      : clash ? 'أكثر من طلب على هذا التاريخ' : '';
    const flag = hard ? '<span class="dateflag"></span>' : clash ? '<span class="dateflag dateflag--soft"></span>' : '';
    return `<div class="${cls}"${tip ? ` title="${tip}"` : ''}>
      <button class="cvadd" data-new="${iso}" aria-label="حجز جديد في ${dmy(iso)}" title="حجز جديد في ${dmy(iso)}"></button>
      <span class="cvnum">${d} ${flag}</span>
      <div class="cvchips">${list.map(chip).join('')}${
        list.length > 3 ? `<button class="cvmore">+${list.length - 3} أخرى</button>` : ''}</div>
    </div>`;
  };

  const dates = [...byDate.keys()].sort();
  const agenda = dates.length ? dates.map((iso) => `<div class="cvday">
      <div class="cvdate">${dmy(iso)} · ${AR_DOW[new Date(iso + 'T00:00:00Z').getUTCDay()]}${
        iso === T ? ' · اليوم' : ''}</div>
      ${byDate.get(iso).map((r) => `<div class="cvitem" data-id="${r.id}"
        style="box-shadow:inset -3px 0 0 ${calColor(r.status)[2]}">
        <span class="t">${esc(String(r.start_time || '').slice(0, 5) || '—')}</span>
        <span class="n">${esc(fullName(r))}</span>
        <span class="muted">${esc([r.city, r.venue, r.occasion].filter(Boolean).join(' · ') || '—')}</span>
        <span class="muted">${staffCell(r)}</span>
        <span class="s">${badge(r.status)}</span>
      </div>`).join('')}
    </div>`).join('') : '<div class="empty">لا مناسبات في هذا الشهر</div>';

  // اليوم / غداً — the closest thing to a reminder that needs no notifications at all.
  const tomorrow = localISO(new Date(Date.now() + 864e5));
  const upcoming = (iso) => (soonRows || []).filter((r) => String(r.event_date).slice(0, 10) === iso && r.status !== 'ملغي');
  const line = (label, list) => list.length ? `<span>${label}: ${list.map((r) =>
    esc(fullName(r)) + (r.start_time ? ` (${esc(String(r.start_time).slice(0, 5))})` : '')
    + (r.city ? ' — ' + esc(r.city) : '')).join('، ')}</span>` : '';
  const soonHtml = line('اليوم', upcoming(T)) + line('غداً', upcoming(tomorrow));

  const count = (fn) => state.calRows.filter(fn).length;
  const due = state.calRows.reduce((s, r) =>
    s + (r.status !== 'ملغي' && Number(r.remaining) > 0 ? Number(r.remaining) : 0), 0);

  box.innerHTML = `
    <div class="cvhead">
      <!-- Triangles, not ‹ ›: the angle quotes are Bidi_Mirrored, so RTL flips them and both
           arrows end up pointing the same way. Time runs right-to-left here — back is ▶. -->
      <button class="cvnav" id="cvPrev" title="الشهر السابق" aria-label="الشهر السابق">▶</button>
      <span class="mon">${AR_MONTHS[mIdx]} ${y}</span>
      <button class="cvnav" id="cvNext" title="الشهر التالي" aria-label="الشهر التالي">◀</button>
      <button class="btn btn--ghost btn--sm" id="cvToday">اليوم</button>
      <label class="toggle"><input type="checkbox" id="cvRealOnly" ${state.calRealOnly ? 'checked' : ''}> المؤكدة فقط</label>
      <span class="count">${
        // Say so when the filter is hiding some — "4 مناسبة" beside 12 chips would lie.
        rows.length !== state.calRows.length ? `${rows.length} معروضة من ` : ''
      }${state.calRows.length} مناسبة · ${count((r) => r.status === 'مؤكد' || r.status === 'مكتمل')} مؤكدة
        · ${count((r) => r.status === 'دفع العربون')} عربون · متبقٍ ${money(due)}</span>
    </div>
    ${soonHtml ? `<div class="verdict adv">${soonHtml}</div>` : ''}
    <div class="cvgrid">
      ${AR_DOW.map((d) => `<div class="cvdow">${d}</div>`).join('')}
      ${cells.map(cellHtml).join('')}
    </div>
    <div class="cvagenda">${agenda}</div>`;

  $('#cvPrev').onclick = () => shiftMonth(-1);
  $('#cvNext').onclick = () => shiftMonth(1);
  $('#cvToday').onclick = () => { state.calMonth = localISO().slice(0, 7); loadCalendarTab().catch(() => {}); };
  $('#cvRealOnly').onchange = (e) => { state.calRealOnly = e.target.checked; renderCalendarTab(soonRows); };
  $$('.cvchip, .cvitem', box).forEach((el) => el.onclick = () => openDrawerById(Number(el.dataset.id)));
  $$('.cvmore', box).forEach((el) => el.onclick = () => el.closest('.cvcell').classList.toggle('open'));
  $$('.cvadd', box).forEach((el) => el.onclick = () => openDrawer(null, el.dataset.new));
}

// ---------- 🗓 تقويم Google ----------
// Every real booking (مؤكد / دفع العربون / مكتمل) is pushed to the owner's Google Calendar
// as it is saved. This box reports whether that link is healthy and catches up anything
// still missing — bookings made before the link existed, or saves that hit a Google outage.
const CAL_REASON = {
  'not-configured': 'لم تُضبط بيانات الاتصال بعد',
  'not-shared': 'التقويم غير مُشارك مع حساب الخدمة، أو المعرّف غير صحيح',
  unreachable: 'تعذّر الوصول إلى Google',
};

function renderCal(d) {
  const box = $('#calBox');
  if (!d.configured || !d.probe.ok) {
    const why = CAL_REASON[d.probe.reason] || d.probe.reason || 'غير معروف';
    box.className = 'verdict ' + (d.configured ? 'taken' : 'soft');
    box.innerHTML = `<span>🗓 تقويم Google غير مُفعّل — ${esc(why)}</span>
      <small>${esc(d.probe.detail || 'الحجوزات تُحفظ كالمعتاد؛ الربط بالتقويم فقط هو المعطّل.')}</small>
      <button class="btn btn--ghost btn--sm" id="calHide">إخفاء</button>`;
  } else {
    const pend = d.pending;
    box.className = 'verdict ' + (pend ? 'soft' : 'free');
    box.innerHTML = `<span>🗓 متصل بتقويم «${esc(d.probe.summary || d.calendar_id)}»</span>
      <small>${d.linked} حجز مرتبط · التوقيت ${esc(d.probe.timeZone || d.timezone)}</small>
      ${pend
        ? `<small>${pend} حجز بحاجة للمزامنة${d.pending_rows.length
            ? ' — ' + d.pending_rows.slice(0, 4).map((r) =>
                esc((r.booking_no || '#' + r.id) + ' ' + (r.name || '')) + (r.action === 'remove' ? ' (إزالة)' : '')).join('، ')
            : ''}</small>
           <button class="btn btn--sm" id="calSync">مزامنة الآن</button>`
        : '<small>كل الحجوزات المؤكدة القادمة موجودة في التقويم ✓</small>'}
      <button class="btn btn--ghost btn--sm" id="calHide">إخفاء</button>`;
  }
  box.style.display = '';
  $('#calHide').onclick = () => box.style.display = 'none';
  const sync = $('#calSync');
  if (sync) sync.onclick = async () => {
    sync.disabled = true; sync.textContent = 'جارٍ المزامنة…';
    try {
      const r = await api('/office/api/calendar', { method: 'POST' });
      toast(`التقويم: أُضيف ${r.added} · أُزيل ${r.removed}` + (r.failed ? ` · فشل ${r.failed}` : ' ✓'), !!r.failed);
      if (r.errors && r.errors.length) console.warn('calendar sync errors:', r.errors);
      await Promise.all([loadCal(), loadRows()]);
    } catch (e) {
      if (e.message !== 'unauthorized') toast('تعذّرت المزامنة — حاول لاحقاً', true);
      sync.disabled = false; sync.textContent = 'مزامنة الآن';
    }
  };
}

async function loadCal() {
  try { renderCal(await api('/office/api/calendar')); }
  catch (e) { if (e.message !== 'unauthorized') toast('تعذّر قراءة حالة التقويم', true); }
}

$('#calBtn').onclick = () => {
  const box = $('#calBox');
  if (box.style.display !== 'none') { box.style.display = 'none'; return; }
  box.className = 'verdict soft';
  box.innerHTML = '<span>🗓 جارٍ فحص الربط بتقويم Google…</span>';
  box.style.display = '';
  loadCal();
};

// ---------- quick date-availability check (فحص تاريخ) ----------
function openDatePicker() {
  const inp = $('#dateCheckInput');
  try { inp.showPicker(); } catch { inp.focus(); }
}
function setDateCheck(iso) {
  if (!iso) return;
  state.filters.dateCheck = iso;
  const chip = $('#dateCheckChip');
  chip.textContent = `📅 ${dmy(iso)} ✕`;
  chip.style.display = '';
  loadRows();
}
// Leaving the check returns to the normal list. reload=false when another filter is taking
// over (it will load itself); reload=true when the owner explicitly clears the check.
function clearDateCheck(reload) {
  const was = state.filters.dateCheck;
  state.filters.dateCheck = '';
  $('#dateCheckInput').value = '';
  $('#dateCheckChip').style.display = 'none';
  $('#dateVerdict').style.display = 'none';
  if (reload && was) loadRows();
}
$('#dateCheckBtn').onclick = openDatePicker;
$('#dateCheckInput').onchange = (e) => setDateCheck(e.target.value);
$('#dateCheckChip').onclick = () => clearDateCheck(true);

let qTimer;
$('#q').addEventListener('input', (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { clearDateCheck(false); state.filters.q = e.target.value.trim(); loadRows(); }, 300);
});
$('#month').onchange = (e) => { clearDateCheck(false); state.filters.month = e.target.value; loadRows(); };
$('#upcoming').onchange = (e) => { clearDateCheck(false); state.filters.upcoming = e.target.checked; loadRows(); };
$('#nopast').onchange = (e) => { clearDateCheck(false); state.filters.nopast = e.target.checked; loadRows(); };
$('#order').onchange = (e) => { clearDateCheck(false); state.filters.order = e.target.value; loadRows(); };

const PANES = { bookings: '#gridbox', callback: '#gridbox', calendar: '#calendar', cities: '#pricing', finance: '#finance', insights: '#insights', inventory: '#inventory', visitors: '#visitors', capi: '#capi', whatsapp: '#whatsapp' };
$$('#tabs button').forEach((b) => b.onclick = () => {
  $$('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  state.tab = b.dataset.tab;
  const pane = PANES[state.tab];
  $('#filters').style.display = pane === '#gridbox' ? '' : 'none';
  $('#dateVerdict').style.display = 'none';
  $('#calBox').style.display = 'none';
  for (const sel of ['#gridbox', '#calendar', '#pricing', '#finance', '#insights', '#inventory', '#visitors', '#capi', '#whatsapp']) $(sel).style.display = sel === pane ? '' : 'none';
  if (state.tab === 'calendar') loadCalendarTab().catch(() => {});
  else if (state.tab === 'cities') loadPricing().catch(() => {});
  else if (state.tab === 'finance') loadFinance().catch(() => {});
  else if (state.tab === 'insights') loadInsights().catch(() => {});
  else if (state.tab === 'inventory') loadInventory().catch(() => {});
  else if (state.tab === 'visitors') loadVisitors().catch(() => {});
  else if (state.tab === 'capi') loadCapi().catch(() => {});
  else if (state.tab === 'whatsapp') loadWa().catch(() => {});
  else loadRows();
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

(async function init() {
  try {
    await loadMeta();
    await loadRows();
  } catch (e) { /* veil already shown on 403 */ }
})();
</script>
</body>
